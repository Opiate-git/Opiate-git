<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Ahmet Aktay: Information Technology student, PHP and MySQL, Python, AI-assisted development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#1b1033"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
    .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .line { stroke-dasharray: 520; animation: draw 2.4s ease-out both; }
    .glow { animation: pulse 5s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes draw { from { stroke-dashoffset: 520; } to { stroke-dashoffset: 0; } }
    @keyframes pulse { 50% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .line, .glow { animation: none; } }
  </style>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <g class="glow" fill="none" stroke="url(#ac)" stroke-width="2">
    <circle cx="1020" cy="160" r="96" stroke-opacity="0.55"/>
    <circle cx="1020" cy="160" r="66" stroke-opacity="0.35"/>
    <circle cx="1020" cy="160" r="36" stroke-opacity="0.25"/>
  </g>
  <g fill="url(#ac)">
    <circle cx="1020" cy="64" r="7"/>
    <circle cx="1103" cy="208" r="7"/>
    <circle cx="937" cy="208" r="7"/>
  </g>
  <text class="mono" x="1020" y="171" font-size="34" fill="#e5e7eb" text-anchor="middle">&lt;/&gt;</text>
  <text class="mono" x="72" y="82" font-size="20" fill="#22d3ee">$ whoami<tspan class="cursor"> _</tspan></text>
  <text class="sans" x="68" y="162" font-size="72" font-weight="800" fill="#f8fafc">Ahmet Aktay</text>
  <path class="line" d="M72 188H592" stroke="url(#ac)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <text class="sans" x="72" y="232" font-size="26" fill="#cbd5e1">Information Technology Student</text>
  <text class="mono" x="72" y="272" font-size="19" fill="#a78bfa">PHP &amp; MySQL  /  Python  /  AI-Assisted Development</text>
</svg>
